name: Judge CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: codefight-judge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  judge-checks:
    name: Judge checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout judge
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build judge binary
        run: go build -o judge ./cmd/judge

      - name: Docker build judge
        run: docker build -t codefight-judge-ci .

      - name: Docker build Go runtime
        run: docker build -t judge-go-ci ./docker/judge-go

      - name: Docker build Python runtime
        run: docker build -t judge-python-ci ./docker/judge-python

  deploy:
    name: Deploy judge
    runs-on: ubuntu-latest
    needs: judge-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            /opt/codefight/scripts/deploy.sh
