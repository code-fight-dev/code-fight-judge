name: Judge CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: codefight-deploy
  cancel-in-progress: true

jobs:
  judge-checks-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout judge
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build judge
        run: go build -o judge ./cmd/judge

      - name: Build runtime images
        run: |
          docker build -t judge-go:1.24 ./docker/judge-go
          docker build -t judge-python:3.12 ./docker/judge-python

      - name: Deploy to VPS
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            /opt/codefight/scripts/deploy.sh
