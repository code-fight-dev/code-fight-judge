name: Judge CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: codefight-judge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  judge-checks:
    name: Judge checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: judge
          POSTGRES_PASSWORD: judge-ci-password
          POSTGRES_DB: judge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U judge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout judge
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build judge binary
        run: go build -o judge ./cmd/judge

      - name: Docker build judge
        run: docker build -t codefight-judge-ci .

      - name: Docker build Go runtime
        run: docker build -f docker/judge-go/Dockerfile -t judge-go-ci .

      - name: Docker build Python runtime
        run: docker build -f docker/judge-python/Dockerfile -t judge-python-ci .

      - name: Test supervisor with real containers
        env:
          JUDGE_SANDBOX_INTEGRATION: "1"
          JUDGE_INTEGRATION_RUNTIME: runc
          JUDGE_INTEGRATION_GO_IMAGE: judge-go-ci
          JUDGE_INTEGRATION_PYTHON_IMAGE: judge-python-ci
          JUDGE_TEST_DATABASE_URL: postgres://judge:judge-ci-password@localhost:5432/judge?sslmode=disable
        run: go test -tags integration ./internal/runner ./internal/storage

  deploy:
    name: Deploy judge
    runs-on: ubuntu-latest
    needs: judge-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            /opt/codefight/scripts/deploy.sh
