name: Judge CI/CD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: codefight-judge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  judge-checks:
    name: Judge checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: judge
          POSTGRES_PASSWORD: judge-ci-password
          POSTGRES_DB: judge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U judge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout judge
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Setup Node runtime for adapter tests
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install local adapter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nlohmann-json3-dev
          npm install --prefix /tmp/judge-node-tests --ignore-scripts --no-audit --no-fund --save-exact typescript@5.9.3 @types/node@24.3.0

      - name: Test C++ and Node adapters
        env:
          JUDGE_LOCAL_RUNTIME_TESTS: "1"
          JUDGE_TEST_NODE_MODULES: /tmp/judge-node-tests/node_modules
        run: go test -tags integration ./internal/runner -run '^TestLocal(CPP|Node)'

      - name: Go vet
        run: go vet ./...

      - name: Check dependency vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Run tests
        run: go test -race ./...

      - name: Build judge binary
        run: go build -o judge ./cmd/judge

      - name: Docker build judge
        run: docker build -t codefight-judge-ci .

      - name: Docker build Go runtime
        run: docker build -f docker/judge-go/Dockerfile -t judge-go-ci .

      - name: Docker build Python runtime
        run: docker build -f docker/judge-python/Dockerfile -t judge-python-ci .

      - name: Docker build C++ runtime
        run: docker build -f docker/judge-cpp/Dockerfile -t judge-cpp-ci .

      - name: Docker build Node runtime
        run: docker build -f docker/judge-node/Dockerfile -t judge-node-ci .

      - name: Install gVisor
        env:
          GVISOR_RELEASE: "20261012.0"
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          cd "$workdir"
          base="https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/x86_64"
          curl -fsSLO "$base/gvisor.tar.bz2"
          curl -fsSLO "$base/gvisor.tar.bz2.sha512"
          sha512sum -c gvisor.tar.bz2.sha512
          sudo tar -xjf gvisor.tar.bz2 -C /usr/local/bin
          sudo /usr/local/bin/runsc install
          sudo systemctl reload docker
          docker run --rm --runtime=runsc --network=none --entrypoint=/bin/true judge-python-ci

      - name: Test supervisor with gVisor
        timeout-minutes: 10
        env:
          JUDGE_SANDBOX_INTEGRATION: "1"
          JUDGE_COMPILE_TIMEOUT: 60s
          JUDGE_INTEGRATION_RUNTIME: runsc
          JUDGE_INTEGRATION_GO_IMAGE: judge-go-ci
          JUDGE_INTEGRATION_PYTHON_IMAGE: judge-python-ci
          JUDGE_INTEGRATION_CPP_IMAGE: judge-cpp-ci
          JUDGE_INTEGRATION_NODE_IMAGE: judge-node-ci
          JUDGE_TEST_DATABASE_URL: postgres://judge:judge-ci-password@localhost:5432/judge?sslmode=disable
        run: go test -count=1 -v -tags integration ./internal/runner ./internal/storage

  deploy:
    name: Deploy judge
    runs-on: ubuntu-latest
    needs: judge-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            /opt/codefight/scripts/deploy.sh
